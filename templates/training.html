{% extends "base.html" %}

{% block content %}
<div class="text-center">
    {% if 'инженер' in prof.lower() or 'строитель' in prof.lower() %}
        <h2 class="text-primary mb-4">Инженерные тренажеры</h2>
        <img src="/static/images/инженер-строитель.jpg"
             alt="Схема инженерных тренажеров" class="img-fluid" style="max-width: 600px;">
        <p class="mt-3">Тренировки по техническому обслуживанию оборудования</p>
    {% else %}
        <h2 class="text-info mb-4">Научные симуляторы</h2>
        <img src="/static/images/астробиолог.jpg"
             alt="Схема научных симуляторов" class="img-fluid" style="max-width: 600px;">
        <p class="mt-3">Тренировки по проведению научных экспериментов</p>
    {% endif %}
</div>
{% endblock %}
