{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="text-center mb-4">Размещение по каютам</h2>
    
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="list-group">
                {% for astronaut in astronauts %}
                <div class="list-group-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">{{ astronaut }}</span>
                        <span class="badge bg-primary rounded-pill">
                            Каюта №{{ loop.index }}
                            {% if loop.first %}
                            <span class="ms-2">(Капитан)</span>
                            {% endif %}
                        </span>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    
    <h4 class="mission-quote mt-4">Комфортного полета, команда!</h4>
</div>
{% endblock %}
